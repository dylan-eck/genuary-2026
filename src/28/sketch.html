<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #wrapper {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      #container {
        width: 1080px;
        height: 1920px;
        background-color: #000000;
        display: flex;
        flex-wrap: wrap;
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 0 0;
      }

      .clock {
        position: relative;
        width: 120px;
        height: 120px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
      }

      .hand {
        position: absolute;
        top: 50%;
        left: 50%;

        background-color: white;

        /* --start-rot: calc(var(--i) * 180deg); */
        --start-rot: 0deg;
        transform-origin: 0% 50%;
        transform: translateY(-50%) rotate(var(--start-rot));
      }

      .hand:first-child {
        width: 50%;
        height: 8px;
        border-radius: 0px 4px 4px 0px;
        animation: rot calc(4s + 0.1s * var(--i)) linear infinite;
      }

      /* .hand:nth-child(2) {
        width: 30%;
        height: 6px;
        border-radius: 0px 3px 3px 0px;
        animation: rot calc(20s + 0.1s * var(--i)) linear infinite;
      } */

      .clock-center {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        background-color: white;
        transform: translate(-50%, -50%);
        border-radius: 50%;
      }

      @keyframes rot {
        from {
          transform: translateY(-50%) rotate(var(--start-rot));
        }
        to {
          transform: translateY(-50%) rotate(calc(360deg + var(--start-rot)));
        }
      }
    </style>
  </head>

    <script>
      window.addEventListener("load", () => {
        const container = document.getElementById("container");
        const wrapper = document.getElementById("wrapper");
        const originalW = 1080;
        const originalH = 1920;

        function updateScale() {
          const scaleX = wrapper.clientWidth / originalW;
          const scaleY = wrapper.clientHeight / originalH;
          const scale = Math.min(scaleX, scaleY);
          container.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", updateScale);
        updateScale(); // run immediately
      });
    </script>
